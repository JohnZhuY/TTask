[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ttask"
version = "9.16.0"
description = "Windows desktop scheduler with fixed and random-window execution"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
ttask = "ttask.__main__:main"

[tool.setuptools.packages.find]
include = ["ttask*"]
